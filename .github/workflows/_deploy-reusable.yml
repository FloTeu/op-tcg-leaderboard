name: _Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true
      sha:
        type: string
        required: true
      min_instances:
        type: number
        default: 0
    outputs:
      url:
        description: Deployed Cloud Run URL
        value: ${{ jobs.deploy.outputs.url }}

env:
  REGION: europe-west1

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        id: build
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/op-tcg:v${VERSION}-${{ inputs.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build and push crawler Docker image
        id: build-crawler
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # Derive the registry base from the web image (same repo, different image name)
          # so the crawler always lands in the same Artifact Registry repo as the web app.
          WEB_BASE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPO }}"
          IMAGE="${WEB_BASE}/op-tcg-crawler:v${VERSION}-${{ inputs.sha }}"
          docker build --platform linux/amd64 -f Dockerfile.crawler -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy Cloud Run Job
        run: |
          IMAGE="${{ steps.build-crawler.outputs.image }}"
          PROJECT="${{ secrets.PROJECT }}"
          SA="cloud-function-sa@${PROJECT}.iam.gserviceaccount.com"
          ENV_VARS="GOOGLE_CLOUD_PROJECT=${PROJECT},CAMOUFOX_HEADLESS=true,SCRAPER_PROXY=${{ secrets.SCRAPER_PROXY_RESIDENTIAL }},NTFY_TOPIC=${{ secrets.NTFY_TOPIC }}"
          if gcloud run jobs describe crawl-sealed-products \
               --region=${{ env.REGION }} --project="${PROJECT}" &>/dev/null; then
            gcloud run jobs update crawl-sealed-products \
              --image="${IMAGE}" \
              --set-env-vars="${ENV_VARS}" \
              --region=${{ env.REGION }} \
              --project="${PROJECT}"
          else
            gcloud run jobs create crawl-sealed-products \
              --image="${IMAGE}" \
              --region=${{ env.REGION }} \
              --project="${PROJECT}" \
              --service-account="${SA}" \
              --set-env-vars="${ENV_VARS}" \
              --tasks=1 \
              --max-retries=1 \
              --task-timeout=1800 \
              --cpu=2 \
              --memory=2Gi
          fi

      - name: Deploy optcg CLI Cloud Run Jobs
        env:
          CARDNEXUS_API_KEY: ${{ secrets.CARDNEXUS_API_KEY }}
        run: |
          # All jobs reuse the crawler image built above with an `optcg ...` entrypoint
          # override — none of them need Camoufox, so no separate image is built.
          # Jobs are created/updated here only; their schedules live in terraform/main.tf.
          IMAGE="${{ steps.build-crawler.outputs.image }}"
          PROJECT="${{ secrets.PROJECT }}"
          SA="cloud-function-sa@${PROJECT}.iam.gserviceaccount.com"
          NTFY_TOPIC="${{ secrets.NTFY_TOPIC }}"

          # deploy_job <name> <comma-separated optcg args> <env vars> <cpu> <memory> <task timeout s> <max retries>
          deploy_job() {
            local name="$1" args="$2" env_vars="$3" cpu="$4" memory="$5" timeout="$6" retries="$7"
            local action=create
            if gcloud run jobs describe "${name}" --region=${{ env.REGION }} --project="${PROJECT}" &>/dev/null; then
              action=update
            fi
            gcloud run jobs "${action}" "${name}" \
              --image="${IMAGE}" \
              --command="optcg" \
              --args="${args}" \
              --set-env-vars="${env_vars}" \
              --region=${{ env.REGION }} \
              --project="${PROJECT}" \
              --service-account="${SA}" \
              --tasks=1 \
              --max-retries="${retries}" \
              --task-timeout="${timeout}" \
              --cpu="${cpu}" \
              --memory="${memory}"
          }

          deploy_job crawl-prices "crawl,limitless,crawl-prices" \
            "GOOGLE_CLOUD_PROJECT=${PROJECT},NTFY_TOPIC=${NTFY_TOPIC},SCRAPER_PROXY=${{ secrets.SCRAPER_PROXY_RESIDENTIAL }}" \
            1 1Gi 1800 1

          # CardNexus is a plain authenticated API (no scraping), so no proxy is needed.
          CARDNEXUS_ENV="GOOGLE_CLOUD_PROJECT=${PROJECT},NTFY_TOPIC=${NTFY_TOPIC},CARDNEXUS_API_KEY=${CARDNEXUS_API_KEY}"
          deploy_job cardnexus-sync-catalog "etl,cardnexus,sync-catalog,--force" \
            "${CARDNEXUS_ENV}" 1 1Gi 900 1
          # No retries: a retry would re-spend the 600/h price quota; the next scheduled
          # run picks up whatever was missed (each product is priced at most once a day).
          deploy_job cardnexus-update-prices "etl,cardnexus,update-prices,-n,550" \
            "${CARDNEXUS_ENV}" 1 1Gi 1800 0

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ${{ steps.build.outputs.image }}
          region: ${{ env.REGION }}
          project_id: ${{ secrets.PROJECT }}
          flags: >-
            --memory=2Gi
            --min-instances=${{ inputs.min_instances }}
            --service-account=${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
            --execution-environment=gen2
          env_vars: |
            CANONICAL_HOST=${{ vars.CANONICAL_HOST }}
            GOOGLE_CLOUD_PROJECT=${{ secrets.PROJECT }}
            GOOGLE_FORM_FEEDBACK_URL=${{ secrets.GOOGLE_FORM_FEEDBACK_URL }}
            SESSION_MIDDLEWARE_SECRET_KEY=${{ secrets.SESSION_MIDDLEWARE_SECRET_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
            DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}